name: Migrate a reel

on:
  workflow_dispatch:
    inputs:
      reel_url:
        description: "Instagram reel URL (e.g. https://www.instagram.com/reel/XXXX/)"
        required: true
        type: string
      force:
        description: "Re-upload even if already synced"
        required: false
        default: false
        type: boolean
      video_url:
        description: "Direct video URL fallback for reels without a media_url (yt-dlp -g)"
        required: false
        type: string

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # See sync.yml: GitHub's concurrency group misses runs created seconds
      # apart, which once produced a duplicate upload. Older in-flight run wins.
      - name: Skip if an older sync-family run is in flight
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=0
          for wf in sync.yml migrate.yml backfill.yml; do
            older=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --status in_progress \
              --json databaseId --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID)] | length")
            [ "${older:-0}" -gt 0 ] && skip=1
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = "1" ]; then
            echo "Another sync-family run is already in flight — skipping to avoid duplicate uploads. Re-run in a minute."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"

      - if: steps.guard.outputs.skip != '1'
        run: pip install requests yt-dlp

      - name: Migrate reel
        if: steps.guard.outputs.skip != '1'
        env:
          REEL_URL: ${{ inputs.reel_url }}
          VIDEO_URL: ${{ inputs.video_url }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python migrate.py

      - name: Commit updated state
        if: steps.guard.outputs.skip != '1'
        env:
          COMMIT_MSG: "Update sync state (manual migration)"
        run: python push_state.py
