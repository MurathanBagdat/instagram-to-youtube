name: Test localization payload (temporary)

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Init-only resumable insert with localizations (no bytes uploaded)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python - <<'EOF'
          import requests
          from sync import get_youtube_access_token

          token = get_youtube_access_token()
          metadata = {
              "snippet": {
                  "title": "localization probe (never uploaded)",
                  "description": "probe",
                  "categoryId": "15",
                  "defaultLanguage": "tr",
                  "defaultAudioLanguage": "tr",
              },
              "status": {"privacyStatus": "private", "selfDeclaredMadeForKids": False},
              "localizations": {
                  "en": {"title": "probe title EN", "description": "probe description EN"},
              },
          }
          resp = requests.post(
              "https://www.googleapis.com/upload/youtube/v3/videos",
              params={"uploadType": "resumable", "part": "snippet,status,localizations"},
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json; charset=UTF-8",
                  "X-Upload-Content-Length": "1000",
                  "X-Upload-Content-Type": "video/mp4",
              },
              json=metadata,
              timeout=60,
          )
          print("status:", resp.status_code)
          print("has session url:", "Location" in resp.headers)
          if resp.status_code != 200:
              print(resp.text[:1000])
              raise SystemExit(1)
          print("Metadata accepted; session abandoned, no video created.")
          EOF
