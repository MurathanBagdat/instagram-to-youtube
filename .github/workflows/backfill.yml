name: Daily archive backfill

# 18:00 Türkiye time = 15:00 UTC (Türkiye is UTC+3 year-round, no DST).
# Chosen to land ~2h before Turkey's 20:00-23:00 viewing peak, giving the
# Shorts algorithm its test window as the audience comes online.
# Migrates ONE historical reel per day, oldest first, starting after the
# anchor reel defined in backfill.py. No-op once the backlog drains.

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List the backlog without uploading"
        required: false
        default: false
        type: boolean

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # See sync.yml: GitHub's concurrency group misses runs created seconds
      # apart, which once produced a duplicate upload. Older in-flight run wins.
      - name: Skip if an older sync-family run is in flight
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=0
          for wf in sync.yml migrate.yml backfill.yml; do
            older=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --status in_progress \
              --json databaseId --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID)] | length")
            [ "${older:-0}" -gt 0 ] && skip=1
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = "1" ]; then
            echo "Another sync-family run is already in flight — skipping to avoid duplicate uploads. Re-run in a minute."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"

      - if: steps.guard.outputs.skip != '1'
        run: pip install requests yt-dlp

      - name: Migrate one archive reel
        if: steps.guard.outputs.skip != '1'
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python backfill.py

      - name: Commit updated state
        if: steps.guard.outputs.skip != '1'
        env:
          COMMIT_MSG: "Update sync state (archive backfill)"
        run: python push_state.py
